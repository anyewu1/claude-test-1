<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>账号密码登录</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; }
#app { max-width: 414px; min-height: 100vh; margin: 0 auto; background: #fff; position: relative; padding-bottom: 80px; }

/* 状态栏 */
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 6px; font-size: 14px; font-weight: 600; color: #000; }
.status-icons { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.status-icons svg { width: 14px; height: 14px; }
.battery { display: inline-flex; align-items: center; border: 1px solid #000; border-radius: 3px; padding: 1px 3px; font-size: 9px; font-weight: 700; margin-left: 2px; position: relative; }
.battery::after { content: ''; width: 1.5px; height: 4px; background: #000; position: absolute; right: -2.5px; top: 50%; transform: translateY(-50%); border-radius: 0 1px 1px 0; }

/* 导航栏 */
.nav-bar { display: flex; align-items: center; padding: 10px 16px; height: 48px; position: relative; }
.nav-back { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.nav-back svg { width: 18px; height: 18px; }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 500; color: #333; }

/* 表单 */
.form { padding: 48px 28px 0; }
.form-item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px solid #eee; position: relative; }
.form-label { width: 56px; font-size: 16px; color: #333; font-weight: 500; }
.form-input { flex: 1; border: none; outline: none; font-size: 15px; color: #333; background: transparent; }
.form-input::placeholder { color: #c8c8c8; }
.forgot { color: #ff8aa6; font-size: 13px; cursor: pointer; margin-left: 10px; }

/* 登录按钮 */
.btn-login { display: block; width: calc(100% - 56px); margin: 38px 28px 18px; height: 46px; border: none; border-radius: 25px; background: #ffc1d1; color: #fff; font-size: 16px; cursor: pointer; transition: background .2s; }
.btn-login.active { background: linear-gradient(90deg, #ff8aa6, #ffa5bd); }

/* 短信登录 */
.sms-link { text-align: center; font-size: 14px; color: #888; cursor: pointer; padding: 6px 0; }
.sms-link::after { content: ' >'; color: #bbb; }

/* 底部协议 */
.footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 28px 18px; }
.agree { display: flex; align-items: flex-start; font-size: 12px; color: #888; line-height: 1.7; }
.checkbox { width: 14px; height: 14px; border: 1.2px solid #c8c8c8; border-radius: 50%; margin-right: 6px; margin-top: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #fff; }
.checkbox.checked { background: #ff8aa6; border-color: #ff8aa6; }
.checkbox.checked::after { content: ''; width: 6px; height: 3px; border-left: 1.2px solid #fff; border-bottom: 1.2px solid #fff; transform: rotate(-45deg) translateY(-1px); }
.agree-text a { color: #3f8fd3; text-decoration: none; cursor: pointer; }
.help { text-align: center; color: #b5b5b5; font-size: 13px; margin-top: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>{{ time }}</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M5 12h14M5 8h14M5 16h14"/></svg>
      <svg viewBox="0 0 24 24" fill="#000"><path d="M6.5 21l5.5-9 5.5 9zM12 3l-3 5h6z"/></svg>
      <svg viewBox="0 0 24 24" fill="#000"><path d="M12 18a2 2 0 100 4 2 2 0 000-4zM4 10a11 11 0 0116 0l-1.5 1.5a9 9 0 00-13 0L4 10zm3 3a7 7 0 0110 0l-1.5 1.5a5 5 0 00-7 0L7 13z"/></svg>
      <span style="font-weight:700;">4G</span>
      <svg viewBox="0 0 24 24" fill="#000"><path d="M2 8h2v8H2zM6 6h2v12H6zM10 4h2v14h-2zM14 2h2v16h-2z"/></svg>
      <span class="battery">74</span>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-back" @click="goBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-title">账号密码登录</div>
  </div>

  <!-- 表单 -->
  <div class="form">
    <div class="form-item">
      <span class="form-label">账号</span>
      <input class="form-input" type="text" v-model="account" placeholder="请输入手机号或邮箱">
    </div>
    <div class="form-item">
      <span class="form-label">密码</span>
      <input class="form-input" type="password" v-model="password" placeholder="请输入密码">
      <span class="forgot" @click="onForgot">忘记密码</span>
    </div>
  </div>

  <!-- 登录按钮 -->
  <button class="btn-login" :class="{ active: canLogin }" @click="onLogin">登录</button>

  <!-- 短信登录 -->
  <div class="sms-link" @click="onSmsLogin">手机短信登录</div>

  <!-- 底部协议 -->
  <div class="footer">
    <div class="agree">
      <span class="checkbox" :class="{ checked: agreed }" @click="agreed = !agreed"></span>
      <span class="agree-text">我已阅读并同意<a @click="showTip('用户协议')">用户协议</a>、<a @click="showTip('隐私政策')">隐私政策</a>,未注册绑定的手机号验证成功后将自动注册</span>
    </div>
    <div class="help" @click="showTip('请联系客服: 400-888-8888')">登录遇到问题</div>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;
createApp({
  setup() {
    const account = ref('');
    const password = ref('');
    const agreed = ref(false);
    const time = ref('14:57');

    const canLogin = computed(() => agreed.value && account.value && password.value);

    const onLogin = () => {
      if (!account.value || !password.value) { alert('请输入账号和密码'); return; }
      if (!agreed.value) { alert('请先阅读并同意用户协议、隐私政策'); return; }
      alert('登录成功!欢迎使用~');
    };
    const onForgot = () => alert('请前往找回密码页面');
    const onSmsLogin = () => alert('切换至短信登录');
    const goBack = () => alert('返回上一页');
    const showTip = (t) => alert(t);

    return { account, password, agreed, time, canLogin, onLogin, onForgot, onSmsLogin, goBack, showTip };
  }
}).mount('#app');
</script>
</body>
</html>
